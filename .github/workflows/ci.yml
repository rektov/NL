name: CI

on:
  push:
  pull_request:

jobs:
  windows-app:
    name: Windows app (MSVC) + tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset default
      - name: Build (Release)
        run: cmake --build --preset release
      - name: Run tests
        run: ctest --preset default
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: NL-exe
          path: build/Release/NL.exe

  logic-tests-linux:
    name: Logic tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset tests -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build --preset tests --parallel $(nproc)
      - name: Run tests
        run: ctest --preset tests --output-on-failure

  format:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          files=$(find src tests tools -name '*.cpp' -o -name '*.h' | \
            grep -v -e 'src/Fonts.cpp' -e 'src/Embedded' -e 'BlurShaders.h')
          clang-format --dry-run -Werror $files
